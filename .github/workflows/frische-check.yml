name: Frische-Check

# Prüft einmal pro Quartal jede Härtezahl gegen ihre lebende Quelle.
# Schlägt der Lauf fehl, hat sich entweder eine Quelle geändert (DRIFT,
# der eigentliche Zweck) oder zu viele Quellen sind unerreichbar geworden.
on:
  schedule:
    - cron: "17 6 2 1,4,7,10 *"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Werkzeuge installieren
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q poppler-utils
          pip install --quiet requests
      - name: Interne Konsistenz prüfen
        run: python3 tools_consistency.py
      # pipefail, sonst entscheidet tee über den Exit-Code und ein DRIFT
      # käme als Erfolg durch. Genau das ist am 8. September passiert.
      - name: Alle Quellen gegenprüfen
        shell: bash
        run: |
          set -o pipefail
          python3 tools_verify.py | tee frische-report.txt
      - name: Report anhängen
        if: always()
        run: |
          echo '## Frische-Check' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 60 frische-report.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      # Ein Drift ist Hausaufgabe für einen Menschen: Quelle neu lesen, Wert
      # ändern, Protokoll schreiben. Deshalb wird er als Issue angelegt und
      # bleibt offen, bis das erledigt ist. Ohne Drift kein Issue.
      - name: Drifts als Issue anlegen
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Frische-Check $(date -u +%Y-%m-%d): Abweichungen oder unerreichbare Quellen"
          {
            echo "Der vierteljährliche Abgleich gegen die Quellen hat Abweichungen gemeldet."
            echo "Vorgehen: Quelle öffnen, Wert neu lesen, hardness.json und PRUEFPROTOKOLL.md zusammen ändern,"
            echo "checked_on am Dateianfang auf das Datum der abgeschlossenen Prüfung setzen."
            echo
            echo '```'
            grep -E "DRIFT|FAIL|unreachable|ERROR" frische-report.txt | head -80 || tail -n 40 frische-report.txt
            echo '```'
            echo
            echo "Lauf: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > issue-body.md
          gh issue create --title "$title" --body-file issue-body.md --label frische-check || \
          gh issue create --title "$title" --body-file issue-body.md
